<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dominion Archive</title>
<style>
:root{--pbg:#F3EEE3;--pt:#2B2620;--pm:#8C7A4B;--ps:#5A6B7A;--pl:rgba(140,122,75,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--pbg);color:var(--pt);font:14px/1.8 'Batang','Georgia',serif;word-break:break-all;overflow-wrap:anywhere}
.f{--m:#8C7A4B;--a:#c4a44a;--l:#F3EEE3;--t1:#d4c9b5;--t2:#b0a48e;--b1:#1a1610;--b2:#2B2620}
.mgmt{--m:#5f8570;--a:#8fb09a;--l:#E8EEE9;--t1:#bac5bd;--t2:#9aa79f;--b1:#111813;--b2:#1a231d}
.lab{--m:#76668f;--a:#a595c4;--l:#ECE8F2;--t1:#c3bdcf;--t2:#a39dae;--b1:#16131c;--b2:#201b29}
.gen{--m:#5f7a92;--a:#8fa8bd;--l:#E6ECF1;--t1:#b9c3cc;--t2:#9aa7b3;--b1:#12181d;--b2:#1b242b}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}
header{text-align:center;border-bottom:2px solid var(--pm);padding:10px 0 12px}
header a{font:bold 20px Georgia,serif;color:var(--pm);letter-spacing:3px;text-decoration:none}
header p{margin:4px 0 0;font:italic 11.5px Georgia,serif;color:var(--ps)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pm);outline-offset:2px}
#q{width:100%;margin-top:14px;padding:9px 12px;background:transparent;border:1px solid var(--pm);border-radius:3px;font-size:13px}
.crumb{margin:14px 0 4px;font-size:12px;color:var(--ps)}
.crumb button{background:none;border:0;padding:0;color:var(--pm);font-size:12px;text-decoration:underline}
h3{font:bold 15px Georgia,serif;color:var(--pm);letter-spacing:1px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pick{display:block;width:100%;text-align:left;background:transparent;border:2px solid var(--pm);border-radius:3px;padding:14px}
.pick b{display:block;font:bold 15px Georgia,serif;color:var(--pm)}
.pick span{font-size:11.5px;color:var(--ps)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--pl);border-radius:2px;padding:2px 10px;font-size:12px;color:var(--pm)}
.chip.on{background:var(--pm);color:var(--pbg)}
.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--pl);border-top:3px solid var(--m);border-radius:3px;overflow:hidden;background:var(--b1)}
.card .th{aspect-ratio:3/4;background-size:cover;background-position:center}
.card div.t{padding:8px 10px 10px}
.card b{display:block;font:bold 14px Georgia,serif;color:var(--l)}
.card span{font-size:11px;color:var(--t2)}
.empty{color:var(--ps);font-style:italic;padding:18px 0}
.dos{max-width:560px;margin:14px auto 0;background:linear-gradient(180deg,var(--b1),var(--b2) 50%,var(--b1));border:2px solid var(--m);border-radius:4px;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.25);color:var(--t2)}
.hero{position:relative;aspect-ratio:750/1000;background-size:cover;background-position:center}
.hero i{position:absolute;inset:35% 0 0;background:linear-gradient(0deg,var(--b1),rgba(0,0,0,0))}
.badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border:1px solid var(--m);border-radius:3px;padding:3px 10px;font-size:10px;color:var(--m);letter-spacing:2px}
.ttl{position:absolute;left:16px;right:16px;bottom:14px}
.ttl small{display:block;font-size:10px;letter-spacing:4px;color:var(--a)}
.ttl h2{margin:2px 0 8px;font:bold 34px/1.1 Georgia,serif;letter-spacing:3px;color:var(--l);text-shadow:0 2px 15px #000}
.tg{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
.tg .r{background:var(--a);color:var(--b1);padding:2px 12px;border-radius:2px;font-weight:bold}
.tg .s{border:1px solid var(--a);color:var(--a);padding:2px 10px;border-radius:2px}
.bd{padding:16px 12px}
.bx{background:rgba(255,255,255,.04);border:1px solid var(--pl);border-top:3px solid var(--m);border-radius:3px;padding:16px 14px;margin-bottom:14px;font-size:12px;line-height:1.9}
.bx h4{margin:0 0 10px;font:bold 12px Georgia,serif;letter-spacing:3px;color:var(--a)}
.bx dt{display:inline;color:var(--m);font-weight:bold}.bx dd{display:inline;margin:0;color:var(--t1)}.bx div{margin:0}
.nm{font:bold 18px Georgia,serif;color:var(--l)}
.sc{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:14px}
.sc .bx{flex:0 0 84%;max-width:360px;scroll-snap-align:start;margin:0;border-top-color:var(--a)}
.bx p{margin:0 0 8px}.bx p b{display:block;color:var(--a);font-size:11.5px}
.pr{background:rgba(120,30,30,.1);border-color:rgba(160,60,60,.4);border-top-color:#a03c3c}
.pr h4{color:#a03c3c}
.rel{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:8px 0;border-top:1px solid var(--pl)}
.rel:first-of-type{border-top:0}
.rel .th{flex:0 0 54px;aspect-ratio:3/4;background-size:cover;background-position:center;border:1px solid var(--pl);border-radius:2px}
.rel b{color:var(--l);font-family:Georgia,serif}.rel em{color:var(--a);font-size:11px;font-style:normal}
.back{background:none;border:1px solid var(--pm);border-radius:3px;padding:3px 12px;color:var(--pm);font-size:12px}
body{background-image:radial-gradient(ellipse at 50% -10%,rgba(140,122,75,.16),transparent 55%)}
header{position:relative}
header a{font:bold 24px Georgia,serif;letter-spacing:6px;background:linear-gradient(90deg,#8C7A4B,#c4a44a,#8C7A4B);-webkit-background-clip:text;background-clip:text;color:transparent}
#mb{position:absolute;left:0;top:8px;background:none;border:1px solid var(--pm);border-radius:3px;padding:3px 10px;color:var(--pm);font-size:12px}
.h0{position:relative;min-height:340px;margin-top:14px;border:2px solid var(--pm);border-radius:3px;overflow:hidden;background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center;text-align:center}
.h0::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--pbg) 12%,transparent 75%)}
.h0>div{position:relative;padding:20px 14px 14px}
.h0 h1{margin:0;font:bold 38px Georgia,serif;letter-spacing:8px;color:var(--pm)}
.h0 small{display:block;font:italic 11.5px Georgia,serif;color:var(--ps)}
.orn{text-align:center;color:var(--pm);margin:14px 0;font-size:12px;letter-spacing:2px}
.sec{position:relative;margin-top:14px;background:var(--pbg);border:2px solid var(--pm);border-radius:3px;padding:16px 14px;box-shadow:inset 0 0 40px rgba(140,122,75,.1)}
.sec::after{content:'❦';position:absolute;right:12px;top:10px;color:var(--pm);opacity:.45}
.rn{display:inline-block;background:var(--pm);color:var(--pbg);font:bold 14.5px Georgia,serif;padding:2px 8px;border-radius:3px;margin-right:8px}
.st{font:bold 15px Georgia,serif;color:var(--pm);letter-spacing:1px}.sec>i{font-size:11.5px;color:var(--ps);margin-left:4px}
.sec p{margin:14px 0 0;font-size:13px;line-height:1.95}.sec p b{color:var(--pm)}
.q{margin-top:12px;background:rgba(90,107,122,.08);border-left:3px solid var(--ps);padding:8px 12px;font-size:12px;color:var(--ps);line-height:1.8}
.q s{opacity:.55}.bar{background:var(--pt);color:var(--pt);padding:0 30px;border-radius:1px}
.nt{text-align:right;font-size:10.5px;color:var(--ps);font-style:italic}
.ls{margin-top:12px;background:rgba(140,122,75,.07);border:1px dashed var(--pl);padding:12px;font-size:12.5px;line-height:1.9}
.ls>b{display:block;color:var(--pm);margin-bottom:6px}.ls>div{margin-bottom:6px}.ls b{color:var(--pm)}
.bg{display:inline-block;background:var(--pm);color:var(--pbg);padding:0 8px;border-radius:2px;font-weight:bold;margin-right:4px}
.sw{text-align:right;font-size:10px;color:var(--pm);margin-top:12px}
.sc2{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:6px 2px 8px}
.lc{flex:0 0 70%;max-width:280px;scroll-snap-align:start;border:1px solid var(--pl);border-top:3px solid var(--pm);border-radius:3px;overflow:hidden;background:rgba(140,122,75,.06)}
.li{aspect-ratio:var(--ar);background-size:cover;background-position:center;filter:saturate(.85)}
.lt{padding:8px 10px 12px;font-size:12px;line-height:1.7}.lt b{color:var(--pm);font-size:13.5px}.lt i{color:var(--ps);font-size:11px}
.card:hover{border-color:var(--a)}.pick:hover{background:var(--pm)}.pick:hover *{color:var(--pbg)}
#nv{position:fixed;z-index:20;top:0;left:0;bottom:0;width:280px;max-width:84vw;background:var(--pbg);border-right:2px solid var(--pm);padding:calc(16px + env(safe-area-inset-top,0px)) 14px 20px;overflow-y:auto;transform:translateX(-102%);transition:transform .25s;box-shadow:6px 0 30px rgba(0,0,0,.25)}
#ov{display:none;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.45)}
body.nav #nv{transform:none}body.nav #ov{display:block}
#nv h5{margin:0 0 10px;font:bold 14px Georgia,serif;color:var(--pm);letter-spacing:2px;border-bottom:1px solid var(--pl);padding-bottom:8px}
.ni{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted var(--pl);padding:8px 4px;font-size:13px;color:var(--pt)}
.ni:hover{color:var(--pm)}.ni.sub{padding-left:18px;font-size:12px;color:var(--ps)}.ni em{font-style:normal;color:var(--pm);font-size:11px}span.ni.dim{font-style:italic}
@media(prefers-reduced-motion:reduce){#nv{transition:none}}
</style></head>
<body><div class="wrap">
<header><button id="mb" aria-label="국가 메뉴 열기" aria-expanded="false">☰ 국가</button><a href="#" id="home">DOMINION</a><p>Character Archive · 도미니온 세계관 캐릭터 도감</p><input id="q" type="search" placeholder="이름, 코드네임, 천사, 팀으로 검색" aria-label="검색"></header>
<main id="app"></main></div><aside id="nv" aria-label="국가 메뉴"></aside><div id="ov"></div>
<script>
/* ===== DATA (이 부분만 추가·수정하면 됩니다) ===== */
const COUNTRIES=[
 {id:'kr',name:'대한민국',en:'Korea',regions:[{id:'seoul',name:'서울 본부'},{id:'busan',name:'부산 지부'}]},
 {id:'jp',name:'일본',en:'Japan',regions:[{id:'hq',name:'일본 본부'}]},
 {id:'cn',name:'중국',en:'China',regions:[]},{id:'fr',name:'프랑스',en:'France',regions:[]},{id:'it',name:'이탈리아',en:'Italy',regions:[]},
 {id:'us',name:'미국',en:'United States',regions:[]},{id:'uk',name:'영국',en:'United Kingdom',regions:[]}];
const DEPT={f:'필드팀',mgmt:'관리부',gen:'일반과',lab:'연구소'};
const CATS=[['S','S급'],['A','A급'],['B','B급'],['C','C급'],['D','D급'],['mgmt','관리부'],['gen','일반과'],['lab','연구소']];
const IMG='https://cdn.phototourl.com/member/';
const CH=[
{id:'zer',c:'kr',r:'seoul',d:'f',rk:'B',code:'ZER',ko:'제르',name:'윤시현',age:'25세 - 3년차',h:'181cm',team:'한국본부 A급 필드팀 (그레이븐 팀)',duty:'소형·중형 악마 토벌, 전장 구속 및 구조 지원',
 img:IMG+'2026-11-05-c3990dc3-189c-48c6-8209-23451d69eb30.jpg',
 desc:'자신에 대한 확신이 지나치게 부족해 사소한 실수도 오래 곱씹으며 스스로를 몰아붙이는 성격이다. 실전 감각과 능력은 뛰어나지만 자기불신 때문에 장기간 B급에 머물고 있다.',
 angel:{n:'Yeiazel',t:'해방형',d:'정신·육체·에너지에 가해진 제약을 끊어내는 해방 계열 천사. 계약자의 의지가 약해질수록 능력의 발현도 불안정해진다.'},
 ab:[{n:'Dark Shadow',t:'PRIMARY',m:'자신의 그림자를 실체화하여 원하는 형태로 변형',e:'칼날·촉수·방벽 등으로 변형해 공격·구속·방어에 활용',l:'주변의 어둠이 적을수록 범위와 출력이 제한됨'},
     {n:'Void',t:'SECONDARY',m:'신체를 짧은 시간 반투명한 암흑 상태로 변화',e:'물리 공격과 일부 장애물을 통과해 회피·침투·이탈',l:'지속시간이 짧고 연속 사용이 어려움'}],
 price:'능력을 사용할수록 체온이 급격히 떨어져 손발의 감각이 둔해지고, 사용 후 한동안 빛과 소리에 대한 감각이 왜곡된다.',
 rel:[['graven','팀장','#능글맞음 #A급 #카마엘'],['beat','팀원','#장난기 #사교적 #사키엘']]},
{id:'graven',c:'kr',r:'seoul',d:'f',rk:'A',code:'GRAVEN',ko:'그레이븐',age:'32세',team:'한국본부 A급 필드팀 (그레이븐 팀)',img:IMG+'2026-11-11-1bd67bdc-46f1-47fb-9b9d-1b3c4bd00c79.jpg',
 desc:'능글맞고 여유로운 A급 팀장.',angel:{n:'Kamael'},rel:[['zer','팀원','#자기혐오 #B급 #예이아젤']]},
{id:'beat',c:'kr',r:'seoul',d:'f',rk:'B',code:'BEAT',ko:'비트',age:'26세',team:'한국본부 A급 필드팀 (그레이븐 팀)',img:IMG+'2026-11-11-384cd11b-f6ce-46db-bf42-0bfc6656d08f.jpg',
 desc:'장난기 많고 사교적인 팀원.',angel:{n:'Sakiel'},rel:[['graven','팀장','#능글맞음 #A급 #카마엘']]},
{id:'setsu',c:'jp',r:'hq',d:'f',rk:'S',code:'SETSU',ko:'세츠',name:'시노노메 레이',age:'33세 - 11년차',h:'183cm',
 img:IMG+'2026-11-07-2e6fe77f-0645-427c-8f67-88285df15312.jpg',
 desc:'우아하고 예의 바른 태도로 누구에게나 다정하지만, 속내는 좀처럼 드러내지 않는다. 친절함과 무관심의 경계를 모호하게 유지하며 개인 영역을 침범당하는 것을 싫어한다.',
 angel:{n:'Kiriel',t:'경계·구분형',d:'안과 밖, 이쪽과 저쪽을 구분하는 경계 계열 천사. 검 형태의 코어를 매개로 계약한다.'},
 ab:[{n:'Iaigiri: Kasane',t:'PRIMARY',m:'납도 상태에서 검을 한 번 발도',e:'동일한 궤적을 따라 여러 참격이 시간차를 두고 연속 발생',l:'참격 수는 검술과 집중력에 비례하며 재사용에는 재납도가 필요'},
     {n:'Kenzoku: Kaisō',t:'SECONDARY',m:'다수의 검을 실체화해 공중에 배치하고 개별 조종',e:'형태·크기·수량을 조절해 다방향 동시 공격과 방어',l:'수량이 많을수록 조종의 정밀도가 떨어짐'}],
 price:'능력을 사용할수록 신체 내부에 균열이 축적되어 피부 아래로 금이 간 흔적이 드러난다. 악화되면 통증과 내부 출혈이 발생하며, 정기적인 안정화 치료로 관리한다.',rel:[]}
];
/* ===== TEMPLATE ===== */
const $=s=>document.querySelector(s),app=$('#app'),S={c:null,r:null,k:null};
const key=c=>c.d==='f'?c.rk:c.d, byId=id=>CH.find(x=>x.id===id);
const place=c=>{const o=COUNTRIES.find(x=>x.id===c.c);return o.name+' · '+o.regions.find(x=>x.id===c.r).name};
const bg=c=>`background-image:url('${c.img}'),linear-gradient(160deg,var(--b2),var(--b1))`;
const tag=c=>c.d==='f'?c.rk+'급 · '+DEPT.f:DEPT[c.d];
const card=c=>`<a class="card ${c.d}" href="#c-${c.id}"><div class="th" style="${bg(c)}"></div><div class="t"><b>${c.code}</b><span>${c.ko} · ${tag(c)}</span><br><span>${place(c)}</span></div></a>`;
const list=a=>a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<p class="empty">등록된 캐릭터가 없습니다. 다른 분류를 선택해 보세요.</p>';
const row=(k,v)=>v?`<div><dt>${k}:</dt> <dd>${v}</dd></div>`:'';
function detail(c){
 const f=c.d==='f',o=COUNTRIES.find(x=>x.id===c.c);
 const place2=o.regions.find(x=>x.id===c.r).name;
 return `<button class="back" onclick="location.hash=''">← 목록으로</button>
 <article class="dos ${c.d}"><div class="hero" style="${bg(c)}"><i></i><span class="badge">CLASSIFIED DOSSIER</span>
 <div class="ttl"><small>CODE NAME</small><h2>${c.code}</h2><div class="tg"><span class="r">${f?c.rk+'-CLASS':DEPT[c.d]}</span><span class="s">${DEPT[c.d]} · ${place2}</span></div></div></div>
 <div class="bd"><div class="bx"><h4>PROFILE</h4><dl style="margin:0">${row('이름',c.name||c.ko)}${row('나이',c.age)}${row('신체',c.h)}${row('소속',c.team||DEPT[c.d]+' · '+place2)}${row(f?'담당 임무':'담당 업무',c.duty||c.spec)}</dl><p style="margin:10px 0 0;color:var(--t2)">${c.desc||''}</p></div>
 ${f&&c.angel?`<div class="bx"><h4>BOUND ANGEL</h4><div class="nm">[ ${c.angel.n} ]</div>${c.angel.t?`<div style="color:var(--m)">[ ${c.angel.t} ]</div>`:''}${c.angel.d?`<p style="margin:8px 0 0">${c.angel.d}</p>`:''}</div>`:''}
 ${c.ab?`<h4 style="color:var(--a);letter-spacing:3px;font:bold 12px Georgia">ABILITIES</h4><div class="sc">${c.ab.map(a=>`<div class="bx"><div class="nm" style="font-size:16px">[ ${a.n} ]</div><div style="color:var(--m);font-size:10px;margin-bottom:8px">${a.t} ABILITY</div><p><b>발동 방식</b>${a.m}</p><p><b>효과</b>${a.e}</p><p><b>한계</b>${a.l}</p></div>`).join('')}</div>`:''}
 ${c.price?`<div class="bx pr"><h4>PRICE OF CONTRACT</h4>${c.price}</div>`:''}
 <div class="bx"><h4>RELATED</h4>${c.rel&&c.rel.length?c.rel.map(([id,rl,tg])=>{const p=byId(id);return p?`<a class="rel" href="#c-${id}"><div class="th ${p.d}" style="${bg(p)}"></div><div><b>${p.code}</b> <em>${rl}</em><br><span style="font-size:11px">${tg}</span></div></a>`:''}).join(''):'<span style="font-style:italic">등록된 연관 인물이 없습니다.</span>'}</div></div></article>`}
function browse(){
 const q=$('#q').value.trim().toLowerCase();
 if(q){const a=CH.filter(c=>[c.code,c.ko,c.name,c.team,c.angel&&c.angel.n].join(' ').toLowerCase().includes(q));return `<h3>검색 결과 ${a.length}건</h3>${list(a)}`}
 const C=COUNTRIES.find(x=>x.id===S.c),R=C&&C.regions.find(x=>x.id===S.r);
 let h=`<div class="crumb"><button onclick="go()">전체</button>${C?` › <button onclick="go('${C.id}')">${C.name}</button>`:''}${R?` › ${R.name}`:''}</div>`;
 if(!C)return world()+`<h3>국가별 캐릭터 도감</h3><div class="grid">${COUNTRIES.map(o=>`<button class="pick" onclick="go('${o.id}')"><b>${o.name}</b><span>${o.en} · ${CH.filter(c=>c.c===o.id).length}명</span></button>`).join('')}</div>`;
 if(!R)return h+`<h3>${C.name} · 지역 선택</h3><div class="grid">${C.regions.map(r=>`<button class="pick" onclick="go('${C.id}','${r.id}')"><b>${r.name}</b><span>${CH.filter(c=>c.c===C.id&&c.r===r.id).length}명</span></button>`).join('')}</div>`;
 const inR=CH.filter(c=>c.c===C.id&&c.r===R.id);
 return h+`<h3>${R.name}</h3><div class="chips"><button class="chip ${S.k?'':'on'}" onclick="go('${C.id}','${R.id}')">전체 ${inR.length}</button>${CATS.map(([k,n])=>`<button class="chip ${S.k===k?'on':''}" onclick="go('${C.id}','${R.id}','${k}')">${n} ${inR.filter(c=>key(c)===k).length}</button>`).join('')}</div><div style="height:14px"></div>${list(S.k?inR.filter(c=>key(c)===S.k):inR)}`}
function go(c,r,k){closeNav();S.c=c||null;S.r=r||null;S.k=k||null;$('#q').value='';location.hash?location.hash='':render()}
function render(){
 const m=location.hash.match(/^#c-(.+)$/),c=m&&byId(m[1]);
 app.innerHTML=c?detail(c):browse();$('#q').style.display=c?'none':'';scrollTo(0,0)}
$('#q').addEventListener('input',()=>{if(location.hash)location.hash='';else render()});
$('#home').addEventListener('click',e=>{e.preventDefault();S.c=S.r=S.k=null;$('#q').value='';location.hash?location.hash='':render()});
